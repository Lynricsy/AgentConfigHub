name: Publish npm CLI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @agent-config-hub/adapters build
      - run: corepack pnpm --filter agent-config-hub build
      - run: corepack pnpm --filter agent-config-hub typecheck
      - run: corepack pnpm --filter agent-config-hub test
      - name: Verify release tag
        run: node -e "const version=require('./packages/cli/package.json').version;if(process.env.GITHUB_REF_NAME!=='v'+version)throw new Error('Release tag must be v'+version)"
      - run: npm install --global npm@11.6.2
      - run: npm publish --provenance --access public
        working-directory: packages/cli
